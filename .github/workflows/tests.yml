name: Tests

on:
  push:
    branches: [main]
    paths:
      - "widgets/**"
      - "shared/**"
      - "package.json"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "widgets/**"
      - "shared/**"
      - "package.json"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
