name: Distance routière IGN tests

on:
  push:
    branches: [main]
    paths:
      - "widgets/route-distance/**"
      - "shared/services/**"
      - "shared/ui/**"
      - "package.json"
      - ".github/workflows/route-distance-tests.yml"
  pull_request:
    paths:
      - "widgets/route-distance/**"
      - "shared/services/**"
      - "shared/ui/**"
      - "package.json"
      - ".github/workflows/route-distance-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:route-distance
