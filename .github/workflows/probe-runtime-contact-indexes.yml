name: Probe runtime contact indexes

on:
  push:
    branches:
      - contacts-resolver-runtime-indexes
    paths:
      - .github/workflows/probe-runtime-contact-indexes.yml
      - scripts/build-contact-index-snapshot.sh
      - scripts/build-contact-runtime-shards.mjs
      - widgets/structure-picker/contact-indexes.js
      - widgets/structure-picker/contact-sources/**
      - widgets/structure-picker/contact-search.js
      - widgets/structure-picker/tests/**
      - package.json

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Overture client
        run: pip install --disable-pip-version-check overturemaps==1.0.2
      - name: Build postcode snapshot
        run: bash scripts/build-contact-index-snapshot.sh
      - name: Run tests
        run: npm test
      - name: Upload probe snapshot
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contact-indexes-probe
          path: /tmp/contact-index-publication/widgets/structure-picker/contact-indexes
          retention-days: 7
