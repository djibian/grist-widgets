name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish contact indexes
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main and all branches
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: source

      - name: Find latest contact index snapshot
        id: contact_indexes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow publish-contact-indexes.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [[ -n "$run_id" ]]; then
            echo "Using contact index snapshot from workflow run $run_id"
          else
            echo "No published contact index snapshot is available yet"
          fi

      - name: Download latest contact index snapshot
        if: steps.contact_indexes.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: contact-indexes
          path: contact-index-snapshot
          github-token: ${{ github.token }}
          run-id: ${{ steps.contact_indexes.outputs.run_id }}

      - name: Assemble production and previews
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site
          git -C source archive main | tar -x -C site
          rm -rf site/previews
          mkdir -p site/previews

          git -C source fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          branches=("contacts-resolver")
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            branches+=("$branch")
          done < <(git -C source for-each-ref --format='%(refname)' 'refs/remotes/origin/preview/*')

          declare -A seen
          for branch in "${branches[@]}"; do
            if [[ -n "${seen[$branch]:-}" ]]; then
              continue
            fi
            seen[$branch]=1

            ref="refs/remotes/origin/$branch"
            if ! git -C source show-ref --verify --quiet "$ref"; then
              continue
            fi

            slug="${branch#preview/}"
            mkdir -p "site/previews/$slug"
            git -C source archive "$ref" | tar -x -C "site/previews/$slug"
          done

          snapshot="$GITHUB_WORKSPACE/contact-index-snapshot"
          if [[ -f "$snapshot/indexed-departments.json" ]]; then
            overlay_snapshot() {
              root="$1"
              target="$root/widgets/structure-picker/contact-indexes"
              rm -rf "$target"
              mkdir -p "$target"
              cp -a "$snapshot/." "$target/"
            }

            overlay_snapshot site
            for preview in site/previews/*; do
              [[ -d "$preview" ]] || continue
              overlay_snapshot "$preview"
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
