name: Structure Picker tests

on:
  push:
    branches: [develop]
    paths:
      - "widgets/structure-picker/**"
      - "package.json"
      - ".github/workflows/structure-picker-tests.yml"
  pull_request:
    paths:
      - "widgets/structure-picker/**"
      - "package.json"
      - ".github/workflows/structure-picker-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
