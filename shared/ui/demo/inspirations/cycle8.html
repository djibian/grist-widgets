<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cycle 8 — survol des actions</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f5;color:#1f2937}.wrap{max-width:980px;margin:auto}.kicker{font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8}.intro h1{margin:5px 0 5px;font-size:22px}.intro p{margin:0 0 22px;color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.sample{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:14px 15px}.label{margin-bottom:12px;font-size:12px;font-weight:700}.header{display:flex;align-items:center;justify-content:space-between;min-height:42px}.count{display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b}.count:before{content:"";width:7px;height:7px;border-radius:50%;background:#067647}.actions{display:flex;align-items:center;gap:7px}.icon{display:grid;place-items:center;width:28px;height:30px;border:0;padding:0;background:transparent;border-radius:8px;cursor:pointer;transition:background-color .14s ease,transform .14s ease,filter .14s ease}.icon svg{width:21px;height:21px;overflow:visible;transition:transform .14s ease}.main{fill:#334155}.stroke{fill:none;stroke:#334155;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#2563eb}.icon:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}.v-a:hover{filter:brightness(.76)}.v-b:hover .accent{fill:#1d4ed8}.v-c:hover{background:#f1f5f9}.v-d:hover{background:#eff6ff}.v-e:hover svg{transform:scale(1.09)}.v-f:hover{background:#f1f5f9;transform:translateY(-1px)}.note{margin-top:10px;color:#94a3b8;font-size:10px}@media(max-width:760px){body{padding:16px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.icon,.icon svg{transition:none}.v-e:hover svg{transform:none}.v-f:hover{transform:none}}
</style>
</head>
<body><main class="wrap"><div class="intro"><div class="kicker">Linear Accent · cycle 8</div><h1>Signal de survol</h1><p>Géométrie figée : Paramètres = E du cycle 6, Actualiser = F du cycle 7 corrigé. Survolez les icônes : seule la réaction au survol varie.</p></div><div class="grid" id="grid"></div></main>
<script>
const variants=[
 ['A','Contraste','icône plus dense, aucun fond','a'],
 ['B','Accent','seul le bleu se renforce','b'],
 ['C','Halo neutre','fond gris très léger','c'],
 ['D','Halo bleu','fond bleuté très léger','d'],
 ['E','Micro-zoom','léger agrandissement du pictogramme','e'],
 ['F','Relief','fond neutre + très léger relief','f']
];
const refresh='<svg viewBox="0 0 24 24"><path class="stroke" d="M13.663 4.175A8 8 0 1 0 19.417 14.997"/><circle class="accent" cx="18.128" cy="6.858" r="2.1"/></svg>';
const settings='<svg viewBox="0 0 24 24"><rect class="main" x="2.5" y="4.5" width="10.5" height="3.4" rx="1.7"/><rect class="main" x="11" y="10.3" width="10.5" height="3.4" rx="1.7"/><rect class="main" x="2.5" y="16.1" width="10.5" height="3.4" rx="1.7"/><circle class="accent" cx="17.2" cy="6.2" r="2.3"/><circle class="accent" cx="7" cy="12" r="2.3"/><circle class="accent" cx="17.2" cy="17.8" r="2.3"/></svg>';
document.querySelector('#grid').innerHTML=variants.map(([letter,name,note,key])=>`<section class="sample"><div class="label">${letter} · ${name}</div><div class="header"><div class="count"><strong>48</strong></div><div class="actions"><button class="icon v-${key}" aria-label="Actualiser" title="Actualiser">${refresh}</button><button class="icon v-${key}" aria-label="Paramètres" title="Paramètres">${settings}</button></div></div><div class="note">${note}</div></section>`).join('');
</script>
</body></html>
